// ---------- Prüfen ----------
function pruefeMal() {
    const feedback = document.getElementById('feedback');
    const m1 = feldZahl('mal-m1');
    const m2 = feldZahl('mal-m2');
    ['rad1', 'rad2'].forEach(function (id) { document.getElementById(id).style.borderColor = ''; });

    // Zuerst: Ist es überhaupt eine passende Merkaufgabe? (zählt nicht als Fehler)
    if (!isNaN(m1) && !isNaN(m2)) {
        aktualisiereMal();
        if (malBewertung.art !== 'ok') {
            malFelder.forEach(function (id) {
                document.getElementById(id).style.borderColor = '';
                document.getElementById(id).style.background = '';
            });
            document.getElementById('mal-m1').style.borderColor = 'orange';
            document.getElementById('mal-m2').style.borderColor = 'orange';
            feedback.textContent = MERK_MELDUNGEN[malBewertung.art];
            feedback.style.color = 'orange';
            return 'hinweis';
        }
    }

    const b = malBewertung; // null, wenn die Merkaufgabe noch nicht ausgefüllt ist
    const felder = [
        { id: 'mal-m1', soll: m1, pflicht: true, gruen: true },
        { id: 'mal-m2', soll: m2, pflicht: true, gruen: true },
        { id: 'mal-merk-erg', soll: m1 * m2, pflicht: true, gruen: true },
        { id: 'pfeil1-zahl', soll: b ? b.pfeile[0].zahl : NaN, pflicht: true, gruen: true },
        { id: 'mal-ergebnis', soll: correctAnswer, pflicht: true, gruen: true }
    ];
    const raeder = [{ id: 'rad1', soll: b ? b.pfeile[0].op : null }];
    if (zwischenaufgabeSichtbar()) {
        // Zwischenaufgabe freiwillig, der zweite Pfeil ist Pflicht
        felder.push({ id: 'mal-z1', soll: b.zwischen.z1, pflicht: false, gruen: true });
        felder.push({ id: 'mal-z2', soll: b.zwischen.z2, pflicht: false, gruen: true });
        felder.push({ id: 'mal-z-erg', soll: b.zwischen.erg, pflicht: false, gruen: true });
        felder.push({ id: 'pfeil2-zahl', soll: b.pfeile[1].zahl, pflicht: true, gruen: true });
        raeder.push({ id: 'rad2', soll: b.pfeile[1].op });
    }

    let ergebnis = pruefeFelder(felder);

    // Drehräder: Rechenart muss gewählt sein
    const radFehlt = raeder.filter(function (r) { return radWert(document.getElementById(r.id)) === null; });
    if (radFehlt.length > 0) {
        radFehlt.forEach(function (r) { markiereVergessen(document.getElementById(r.id)); });
        return 'unvollstaendig';
    }
    if (ergebnis === 'unvollstaendig') {
        return ergebnis;
    }

    const raederRichtig = raeder.every(function (r) { return radWert(document.getElementById(r.id)) === r.soll; });
    if (ergebnis === 'richtig' && raederRichtig) {
        raeder.forEach(function (r) { document.getElementById(r.id).style.borderColor = '#4CAF50'; });
        return 'richtig';
    }

    // Falsch: richtige Felder und Räder grün, falsche Räder schmal rot umranden
    felder.forEach(function (f) {
        if (feldZahl(f.id) === f.soll) {
            document.getElementById(f.id).style.background = '#4CAF50';
        }
    });
    raeder.forEach(function (r) {
        const rad = document.getElementById(r.id);
        if (radWert(rad) === r.soll) {
            rad.style.borderColor = '#4CAF50';
        } else {
            markiereFalsch(rad);
        }
    });
    return 'falsch';
}

// ---------- Hunderterfeld ----------
// a · b = a Reihen mit je b Punkten.
// Stufe 1: Aufgabe blau. Stufe 2: Aufgabe bleibt blau, was zur Merkaufgabe dazukommt rot,
// was von der Merkaufgabe weggenommen wird hellblau.
function zeichneMalHunderterfeld(feldContainer) {
    let merk = null;
    if (Hilfelevel >= 2) {
        if (malBewertung !== null && malBewertung.art === 'ok') {
            merk = { m1: feldZahl('mal-m1'), m2: feldZahl('mal-m2') }; // die Merkaufgabe des Kindes
        } else {
            // sonst eine passende: jedes weitere Drücken zeigt die nächste (Plus, Minus, Verdoppeln)
            const liste = passendeMerkaufgaben(firstNumber, secondNumber);
            merk = liste[Math.min(Hilfelevel - 2, liste.length - 1)];
        }
    }
    for (let i = 1; i <= 100; i++) {
        const feld = document.createElement("div");
        feld.className = "feld";
        const reihe = Math.ceil(i / 10);
        const spalte = (i - 1) % 10 + 1;
        const inAufgabe = reihe <= firstNumber && spalte <= secondNumber;
        const inMerk = merk !== null && reihe <= merk.m1 && spalte <= merk.m2;

        if (merk !== null) {
            if (inAufgabe && inMerk) {
                feld.style.backgroundColor = "#55aaff"; // blau: Aufgabe (steckt schon in der Merkaufgabe)
            } else if (inAufgabe) {
                feld.style.backgroundColor = "#ff5555"; // rot: wird zur Merkaufgabe dazugezählt
            } else if (inMerk) {
                feld.style.backgroundColor = "#bedbf7"; // hellblau: wird von der Merkaufgabe weggenommen
            }
        } else if (Hilfelevel >= 1 && inAufgabe) {
            feld.style.backgroundColor = "#55aaff"; // blau: die Aufgabe
        }
        feldContainer.appendChild(feld);
    }
}

// ---------- Geführte Anleitung ----------
// Das Kind macht die Schritte selbst: Es tippt auf die Glühbirne, schreibt die Zahlen und tippt auf den Haken.
// Gelbe Rahmen und eine Hand zeigen, wo es gerade etwas tun soll und wo es nachschauen kann (Plättchen).
// Drei Arten von Schritten:
//   info   – nur zeigen und vorlesen, weiter mit ▶ (mit auto: nach einer Pause von selbst)
//   tippen – das Kind schreibt Zahlen in Felder; nur die richtigen Zahlen bringen es weiter.
//            Grün werden die Felder erst beim Haken.
//   klick  – das Kind tippt auf etwas (Glühbirne, Rad, Schalter, Haken); dann geht es von selbst weiter
// Bei tippen/klick ist ▶ ausgeblendet. Wer nicht weiterkommt (ins Dunkle tippt, falsche Zahl, lange nichts tut),
// bekommt einen Hinweis: größere Hand oder die richtige Zahl kurz eingeblendet.
// ◀ und die Pünktchen führen zu einem früheren Schritt zurück.

let tour = null; // läuft gerade eine Anleitung? { schritte, index, beschaeftigt, gespeichert, aufraeumen, runde }

function warte(ms) {
    return new Promise(function (fertig) { setTimeout(fertig, ms); });
}

// Setzt eine feste Beispielaufgabe in der aktuell gewählten Art
function zeigeBeispiel(a, b, type) {
    generateExercise(); // alles zurücksetzen
    firstNumber = a;
    secondNumber = b;
    exerciseType = type;
    if (isMal()) {
        correctAnswer = a * b;
        document.getElementById('mal-a').textContent = a;
        document.getElementById('mal-b').textContent = b;
    } else if (isRechenstrich()) {
        berechneRechenstrich(type, a, b);
    } else {
        const plus = type === 'plus';
        correctAnswer = plus ? a + b : a - b;
        zehner = plus ? Math.ceil(a / 10) * 10 : Math.floor(a / 10) * 10;
        firstStep = plus ? zehner - a : a - zehner;
        secondStep = plus ? correctAnswer - zehner : b - firstStep;
        hilfeGrenze = zehner;
        ['wolkenoperatorlinks', 'wolkenoperatorrechts', 'operator'].forEach(function (id) {
            document.getElementById(id).innerHTML = plus ? '+' : '-';
        });
    }
    document.getElementById('firstNumber').textContent = a;
    document.getElementById('secondNumberValue').textContent = b;
    zeichneRechenstrich();
    generateZwanzigerfeld();
    if (document.activeElement) {
        document.activeElement.blur();
    }
}

function sichtbar(selektor) {
    const el = document.querySelector(selektor);
    return el !== null && el.offsetParent !== null;
}

// ---------- Bausteine für die Schritte ----------
// zeige = weitere Stellen, auf die gezeigt wird (z.B. die Plättchen im Feld)
function info(ziel, text, sprich, extra) {
    return Object.assign({ art: 'info', ziele: ziel ? [ziel] : [], text: text, sprich: sprich }, extra || {});
}
function tippen(felder, text, sprich, extra) {
    return Object.assign({ art: 'tippen', ziele: felder.map(function (f) { return '#' + f[0]; }), felder: felder, text: text, sprich: sprich }, extra || {});
}
function klick(ziel, text, sprich, fertigWenn, extra) {
    return Object.assign({ art: 'klick', ziele: [ziel], fertigWenn: fertigWenn || function () { return true; }, text: text, sprich: sprich }, extra || {});
}
const FELD = ['#zwanzigerfeld']; // die Plättchen

function hakenSchritt(knopf) {
    return klick(knopf, '✔ = 🟩', 'Tippe auf den Haken. Grün heißt: richtig!');
}
const ENDE = info(null, '👍 😊', 'Jetzt bist du dran!'); // ohne "Super", das kam schon beim Haken

// Glühbirne antippen, bis die Hilfe-Stufe erreicht ist
function gluehbirne(stufe, extra) {
    return klick('#Hilfe', '💡', stufe === 1 ? 'Tippe auf die Glühbirne.' : 'Tippe noch einmal auf die Glühbirne.',
        function () { return Hilfelevel >= stufe; }, extra);
}

// Zweite Zahl in der Aufgabe in Zehner- und Einer-Ziffer aufteilen, damit man sie einzeln markieren kann
function teileZweiteZahl() {
    const b = secondNumber;
    document.getElementById('secondNumberValue').innerHTML =
        '<span id="ziffer-zehner">' + Math.floor(b / 10) + '</span><span id="ziffer-einer">' + (b % 10) + '</span>';
}

// ---------- Die Anleitungen ----------
function anleitungFuer(art) {
    // Bei "−" ein Minus-Beispiel (bei "+/−" bleibt es beim Plus-Beispiel)
    if ((art === '1' || art === '2') && menu.value === 'minus') {
        return anleitungWolkeMinus(art === '2');
    }

    if (art === '1') {
        return [
            info('#numbers-container', '8 + 5 = ?', 'Das ist die Aufgabe: 8 plus 5.', { auto: 4500, vorher: function () { zeigeBeispiel(8, 5, 'plus'); } }),
            gluehbirne(1),
            info('#zwanzigerfeld', '🔴 = 8', 'Die roten Plättchen sind die 8.', { zeige: ['#firstNumber'] }),
            gluehbirne(2),
            tippen([['firstStep', 2]], '8 + ? = 10', 'Wie viel fehlt von 8 bis 10? Zähle die blauen Plättchen. Schreib die Zahl in die Wolke.', { zeige: FELD }),
            gluehbirne(3),
            tippen([['secondStep', 3]], '5 = 2 + ?', 'Von der 5 hast du 2 schon gebraucht. Wie viele bleiben übrig? Schau bei den Plättchen nach.', { zeige: FELD }),
            tippen([['answer', 13]], '10 + 3 = ?', 'Jetzt das Ergebnis: Wie viel ist 10 plus 3?', { zeige: FELD }),
            hakenSchritt('#checkButton'),
            ENDE
        ];
    }

    if (art === '2') {
        return [
            info('#numbers-container', '47 + 8 = ?', 'Das ist die Aufgabe: 47 plus 8.', { auto: 4500, vorher: function () { zeigeBeispiel(47, 8, 'plus'); } }),
            gluehbirne(1),
            info('#zwanzigerfeld', '🔴 = 47', 'Die roten Plättchen sind die 47.', { zeige: ['#firstNumber'] }),
            gluehbirne(2),
            tippen([['firstStep', 3]], '47 + ?', 'Wie viel fehlt von 47 bis zum nächsten Zehner? Zähle die blauen Plättchen. Schreib die Zahl in die Wolke.', { zeige: FELD }),
            tippen([['zehner', 50]], '47 + 3 = ?', 'Bei welchem Zehner bist du jetzt? Schreib ihn hier hin.', { zeige: FELD }),
            gluehbirne(3),
            tippen([['secondStep', 5]], '8 = 3 + ?', 'Von der 8 hast du 3 schon gebraucht. Wie viele bleiben übrig? Schau bei den Plättchen nach.', { zeige: FELD }),
            tippen([['answer', 55]], '50 + 5 = ?', 'Jetzt das Ergebnis: Wie viel ist 50 plus 5?', { zeige: FELD }),
            hakenSchritt('#checkButton'),
            ENDE
        ];
    }

    if (art === '3') {
        return anleitungRechenstrich();
    }
    return anleitungMal();
}

// Wolke mit Minus: 13 − 5 (1. Klasse) bzw. 53 − 8 (2. Klasse)
// Hilfe bei Minus: Stufe 1 = erste Zahl blau, Stufe 2 = bis zum Zehner weggenommen (hellblau),
// Stufe 3 = auch der Rest weggenommen
function anleitungWolkeMinus(klasse2) {
    const a = klasse2 ? 53 : 13;
    const b = klasse2 ? 8 : 5;
    const z = Math.floor(a / 10) * 10;  // 10 bzw. 50
    const schritt1 = a - z;             // 3
    const schritt2 = b - schritt1;      // 2 bzw. 5
    const ergebnis = a - b;             // 8 bzw. 45

    const schritte = [
        info('#numbers-container', a + ' − ' + b + ' = ?', 'Das ist die Aufgabe: ' + a + ' minus ' + b + '.',
            { auto: 4500, vorher: function () { zeigeBeispiel(a, b, 'minus'); } }),
        gluehbirne(1),
        info('#zwanzigerfeld', '🔵 = ' + a, 'Die blauen Plättchen sind die ' + a + '.', { zeige: ['#firstNumber'] }),
        gluehbirne(2),
        tippen([['firstStep', schritt1]], a + ' − ?',
            'Wie viel musst du von ' + a + ' wegnehmen, damit du ' + (klasse2 ? 'auf dem Zehner' : 'bei ' + z) + ' bist? Zähle die hellblauen Plättchen. Schreib die Zahl in die Wolke.',
            { zeige: FELD })
    ];
    if (klasse2) {
        schritte.push(tippen([['zehner', z]], a + ' − ' + schritt1 + ' = ?',
            'Bei welchem Zehner bist du jetzt? Schreib ihn hier hin.', { zeige: FELD }));
    }
    schritte.push(
        gluehbirne(3),
        tippen([['secondStep', schritt2]], b + ' = ' + schritt1 + ' + ?',
            'Von der ' + b + ' hast du ' + schritt1 + ' schon weggenommen. Wie viele musst du noch wegnehmen? Schau bei den Plättchen nach.',
            { zeige: FELD }),
        tippen([['answer', ergebnis]], z + ' − ' + schritt2 + ' = ?', 'Jetzt das Ergebnis: Wie viel ist ' + z + ' minus ' + schritt2 + '?', { zeige: FELD }),
        hakenSchritt('#checkButton'),
        ENDE
    );
    return schritte;
}

// ---------- Vorlesen ----------
// Zahlen als Wörter vorlesen; sonst sagt die Stimme z.B. "drittens" bei "3." am Satzende
function zahlWort(n) {
    const einer = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn',
        'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn'];
    const zehnerWoerter = ['', '', 'zwanzig', 'dreißig', 'vierzig', 'fünfzig', 'sechzig', 'siebzig', 'achtzig', 'neunzig'];
    if (n < 20) { return einer[n]; }
    if (n === 100) { return 'hundert'; }
    if (n > 100) { return String(n); }
    const z = Math.floor(n / 10);
    const e = n % 10;
    if (e === 0) { return zehnerWoerter[z]; }
    return (e === 1 ? 'ein' : einer[e]) + 'und' + zehnerWoerter[z];
}

function sprich(text) {
    if (!('speechSynthesis' in window)) {
        return;
    }
    speechSynthesis.cancel();
    const satz = new SpeechSynthesisUtterance(text.replace(/\d+/g, function (zahl) { return zahlWort(parseInt(zahl)); }));
    satz.lang = 'de-DE';
    satz.rate = 0.9;
    const stimme = speechSynthesis.getVoices().find(function (v) { return v.lang && v.lang.toLowerCase().startsWith('de'); });
    if (stimme) {
        satz.voice = stimme;
    }
    speechSynthesis.speak(satz);
}

function aktuellerSchritt() {
    return (tour && tour.index >= 0 && tour.index < tour.schritte.length) ? tour.schritte[tour.index] : null;
}

function sprichSchritt() {
    const schritt = aktuellerSchritt();
    if (schritt) {
        sprich(schritt.sprich);
    }
}

// ---------- Ablauf ----------
function starteAnleitung() {
    // zuerst merken: anleitungFuer() rechnet beim Rechenstrich schon das Beispiel aus
    const angefangen = merkeAufgabe();
    tour = {
        schritte: anleitungFuer(klasseMenu.value),
        index: -1,
        beschaeftigt: false,
        aufraeumen: [],
        schrittKlicks: 0,
        runde: 0, // zählt jeden Sprung zurück; alte Zeitgeber merken so, dass sie nicht mehr gelten
        // Einstellungen merken, die die Anleitung verändert
        gespeichert: {
            rad1: document.getElementById('rad1').dataset.klicks,
            rad2: document.getElementById('rad2').dataset.klicks,
            zuZeigen: zuZeigen.checked,
            feldSichtbar: isZwanzigerfeldVisible,
            erwAn: isErweitert(), // die Anleitung läuft immer im normalen Zahlenraum
            aufgabe: angefangen // die angefangene Aufgabe kommt danach zurück
        }
    };
    if (erw[klasseMenu.value]) {
        erw[klasseMenu.value].an = false;
    }
    if (!isZwanzigerfeldVisible) {
        toggleZwanzigerfeld(); // Glühbirne und Plättchen werden gebraucht
    }
    document.getElementById('tour').style.display = 'block';
    // Platz unten, damit die Seite unter der Sprechblase hervorrutschen kann (statt dass die Blase springt)
    document.body.classList.add('tour-laeuft');
    naechsterSchritt();
}

function beendeAnleitung() {
    if (!tour) {
        return;
    }
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
    }
    raeumeSchrittAuf();
    const gespeichert = tour.gespeichert;
    tour = null;
    document.getElementById('tour').style.display = 'none';
    document.body.classList.remove('tour-laeuft');
    // Einstellungen wiederherstellen
    ['rad1', 'rad2'].forEach(function (id) {
        const rad = document.getElementById(id);
        rad.dataset.klicks = gespeichert[id];
        zeigeRad(rad);
    });
    zuZeigen.checked = gespeichert.zuZeigen;
    if (isZwanzigerfeldVisible !== gespeichert.feldSichtbar) {
        toggleZwanzigerfeld();
    }
    if (erw[klasseMenu.value]) {
        erw[klasseMenu.value].an = gespeichert.erwAn;
    }
    stelleAufgabeWiederHer(gespeichert.aufgabe);
}

// Angefangene Aufgabe merken (Zahlen, Eingaben, Hilfestufe), damit "?" sie nicht verwirft
function merkeAufgabe() {
    return {
        a: firstNumber,
        b: secondNumber,
        type: exerciseType,
        hilfe: Hilfelevel,
        gezaehlt: taskCounted,
        geloest: taskSolved,
        felder: Array.from(document.querySelectorAll('#main input[type=number]')).map(function (el) { return [el.id, el.value]; })
    };
}

function stelleAufgabeWiederHer(m) {
    if (m.geloest) {
        generateExercise(); // war schon gelöst -> einfach die nächste
        return;
    }
    zeigeBeispiel(m.a, m.b, m.type);
    const eintragen = function () {
        m.felder.forEach(function (f) { document.getElementById(f[0]).value = f[1]; });
    };
    eintragen();
    if (isMal()) {
        aktualisiereMal(); // Zwischenaufgabe und Pfeile passend zur Merkaufgabe
        eintragen();
    }
    Hilfelevel = m.hilfe;
    taskCounted = m.gezaehlt;
    generateZwanzigerfeld();
}

// Event-Listener, Zeitgeber und Hinweise des letzten Schritts entfernen
function raeumeSchrittAuf() {
    if (tour) {
        tour.aufraeumen.forEach(function (weg) { weg(); });
        tour.aufraeumen = [];
        clearTimeout(tour.hinweisZeit);
    }
    document.getElementById('tour-zahlen').innerHTML = '';
    document.getElementById('tour-markierungen').classList.remove('gross');
    document.getElementById('tour-weiter').classList.remove('pulsieren');
}

// Wenn das Kind länger nichts tut, kommt ein Hinweis (und danach immer wieder)
function planeHinweis() {
    if (!tour) {
        return;
    }
    clearTimeout(tour.hinweisZeit);
    tour.hinweisZeit = setTimeout(function () {
        zeigeHinweis();
        planeHinweis();
    }, 12000);
}

// Hinweis, wo das Kind etwas tun soll
function zeigeHinweis() {
    const schritt = aktuellerSchritt();
    if (!schritt || tour.beschaeftigt) {
        return;
    }
    if (schritt.art === 'info' || schritt.freiwillig) {
        // ▶ wippen lassen
        const weiter = document.getElementById('tour-weiter');
        weiter.classList.remove('pulsieren');
        void weiter.offsetWidth; // Animation neu starten
        weiter.classList.add('pulsieren');
        return;
    }
    // Hand und Rahmen groß machen
    const markierungen = document.getElementById('tour-markierungen');
    markierungen.classList.add('gross');
    const runde = tour.runde;
    const index = tour.index;
    setTimeout(function () {
        if (tour && tour.runde === runde && tour.index === index) {
            markierungen.classList.remove('gross');
        }
    }, 3000);
    // Bei Zahlen: die richtige Zahl beim ersten noch nicht richtigen Feld kurz hinschreiben
    if (schritt.art === 'tippen') {
        const offen = schritt.felder.find(function (f) { return parseInt(document.getElementById(f[0]).value) !== f[1]; });
        if (offen) {
            zeigeZahl(document.getElementById(offen[0]), offen[1]);
        }
    }
}

// Richtige Zahl kurz über dem Feld einblenden und wieder wegnehmen.
// Stand eine falsche Zahl im Feld, wird sie danach gelöscht, damit das Kind neu schreiben kann.
function zeigeZahl(el, wert) {
    const ablage = document.getElementById('tour-zahlen');
    ablage.innerHTML = '';
    const r = el.getBoundingClientRect();
    const zahl = document.createElement('div');
    zahl.className = 'tour-zahl';
    zahl.textContent = wert;
    ablage.appendChild(zahl);
    const oben = r.top - zahl.offsetHeight - 10;
    zahl.style.left = (r.left + r.width / 2) + 'px';
    zahl.style.top = (oben > 0 ? oben : r.bottom + 10) + 'px';
    const runde = tour.runde;
    const index = tour.index;
    setTimeout(function () {
        if (zahl.parentNode) {
            zahl.parentNode.removeChild(zahl);
        }
        if (tour && tour.runde === runde && tour.index === index && el.value !== '' && parseInt(el.value) !== wert) {
            el.value = '';
            el.style.borderColor = '';
            el.focus({ preventScroll: true });
        }
    }, 2500);
}

// Haken während der Anleitung: prüfen und grün anzeigen, aber nichts zählen
function tourHaken() {
    const feedback = document.getElementById('feedback');
    const ergebnis = isMal() ? pruefeMal() : (isRechenstrich() ? pruefeRechenstrich() : pruefeWolke());
    if (ergebnis === 'richtig') {
        feedback.textContent = "Richtig! Super gemacht!";
        feedback.style.color = "green";
    } else if (ergebnis !== 'hinweis') {
        feedback.textContent = "Schau noch einmal.";
        feedback.style.color = "orange";
    }
}

// Schritt geschafft: kurz loben (nicht bei der Glühbirne), dann weiter.
// Nach dem Haken etwas länger warten, damit man die grünen Felder sieht.
function schrittGeschafft(ohneLob, lange) {
    if (!tour || tour.beschaeftigt) {
        return;
    }
    tour.beschaeftigt = true;
    raeumeSchrittAuf();
    if (!ohneLob) {
        sprich('Super!');
    }
    // Während der kurzen Pause alles abdunkeln (keine Löcher), damit nicht aus Versehen zweimal getippt wird
    document.getElementById('tour-maske-pfad').setAttribute('d', 'M0 0H' + window.innerWidth + 'V' + window.innerHeight + 'H0Z');
    document.getElementById('tour-markierungen').innerHTML = '';
    const runde = tour.runde;
    setTimeout(function () {
        if (tour && tour.runde === runde) {
            tour.beschaeftigt = false;
            naechsterSchritt();
        }
    }, lange ? 2500 : (ohneLob ? 900 : 1300));
}

// ◀: einen Schritt zurück (Schritte, die gerade nicht passen, werden übersprungen)
function schrittZurueck() {
    if (!tour) {
        return;
    }
    let ziel = tour.index - 1;
    while (ziel > 0 && tour.schritte[ziel].wenn && !tour.schritte[ziel].wenn()) {
        ziel--;
    }
    springeZu(Math.max(ziel, 0));
}

// Zu einem früheren Schritt springen: die Beispielaufgabe neu aufbauen und alle Schritte
// davor still nachspielen (Zahlen eintragen, Glühbirne/Rad antippen), dann den Schritt zeigen.
function springeZu(ziel) {
    if (!tour || ziel > tour.index) {
        return;
    }
    tour.runde++;
    tour.beschaeftigt = false;
    raeumeSchrittAuf();
    document.getElementById('feedback').textContent = '';
    for (let i = 0; i < ziel; i++) {
        const schritt = tour.schritte[i];
        tour.index = i;
        tour.schrittKlicks = 0;
        if (schritt.vorher) {
            schritt.vorher();
        }
        if (schritt.wenn && !schritt.wenn()) {
            continue;
        }
        if (schritt.art === 'tippen') {
            schritt.felder.forEach(function (f) {
                const el = document.getElementById(f[0]);
                el.value = f[1];
                el.dispatchEvent(new Event('input', { bubbles: true }));
            });
        } else if (schritt.art === 'klick' && schritt.ziele[0] !== '#checkButton' && schritt.ziele[0] !== '#checkButtonMal') {
            const el = document.querySelector(schritt.ziele[0]);
            for (let k = 0; k < 10 && !(tour.schrittKlicks > 0 && schritt.fertigWenn()); k++) {
                tour.schrittKlicks++;
                el.click();
            }
        }
    }
    // Felder ohne Farben (grün vom Haken, rote Rahmen) zeigen
    document.querySelectorAll('input').forEach(function (el) {
        el.style.borderColor = '';
        if (el.style.background.indexOf('rgb(76, 175, 80)') >= 0) {
            el.style.background = '';
        }
    });
    tour.index = ziel - 1;
    naechsterSchritt();
}

function naechsterSchritt() {
    if (!tour || tour.beschaeftigt) {
        return;
    }
    raeumeSchrittAuf();
    if (tour.index >= tour.schritte.length - 1) {
        beendeAnleitung();
        return;
    }
    tour.index++;
    tour.schrittKlicks = 0;
    const schritt = tour.schritte[tour.index];
    if (schritt.vorher) {
        schritt.vorher();
    }
    // Schritte überspringen, die gerade nicht passen (z.B. Schalter bei "ohne ZÜ")
    if (schritt.wenn && !schritt.wenn()) {
        naechsterSchritt();
        return;
    }
    const letzter = tour.index === tour.schritte.length - 1;

    // Anzeige in der Blase
    document.getElementById('tour-text').textContent = schritt.text;
    const weiter = document.getElementById('tour-weiter');
    weiter.textContent = letzter ? '✔' : '▶';
    // ▶ nur, wenn das Kind nichts selbst tun muss
    weiter.classList.toggle('versteckt', (schritt.art !== 'info' && !schritt.freiwillig) || !!schritt.auto);
    document.getElementById('tour-zurueck').classList.toggle('versteckt', tour.index === 0);
    // Pünktchen: frühere sind antippbar (dorthin zurück)
    document.getElementById('tour-punkte').innerHTML = tour.schritte.map(function (s, i) {
        if (i === tour.index) {
            return '<span class="aktiv"></span>';
        }
        return i < tour.index ? '<span class="fertig" onclick="springeZu(' + i + ')"></span>' : '<span></span>';
    }).join('');

    // Element ins Bild holen (iPad hochkant)
    const erstesZiel = schritt.ziele.length ? document.querySelector(schritt.ziele[0]) : null;
    if (erstesZiel && erstesZiel.offsetParent !== null) {
        erstesZiel.scrollIntoView({ block: 'center' });
    }
    setzeSpot();
    sprich(schritt.sprich);

    // Erster Schritt: kurz zeigen, dann ohne Tippen weiter
    if (schritt.auto) {
        const zeit = setTimeout(function () {
            if (tour && aktuellerSchritt() === schritt && !tour.beschaeftigt) {
                naechsterSchritt();
            }
        }, schritt.auto);
        tour.aufraeumen.push(function () { clearTimeout(zeit); });
        return;
    }
    if (schritt.art !== 'info' && !schritt.freiwillig) {
        planeHinweis();
    }

    if (schritt.art === 'tippen') {
        // Bei jeder Eingabe prüfen: falsch = roter Rahmen und richtige Zahl kurz zeigen,
        // alle richtig = weiter (grün wird erst beim Haken)
        const pruefe = function () {
            let alleRichtig = true;
            schritt.felder.forEach(function (f) {
                const el = document.getElementById(f[0]);
                el.style.borderColor = '';
                if (el.value === '') {
                    alleRichtig = false;
                } else if (parseInt(el.value) !== f[1]) {
                    alleRichtig = false;
                    if (el.value.length >= String(f[1]).length) {
                        markiereFalsch(el);
                        zeigeZahl(el, f[1]);
                    }
                }
            });
            if (alleRichtig) {
                schrittGeschafft();
            } else {
                planeHinweis();
            }
        };
        schritt.felder.forEach(function (f) {
            const el = document.getElementById(f[0]);
            el.addEventListener('input', pruefe);
            tour.aufraeumen.push(function () { el.removeEventListener('input', pruefe); });
        });
        const leer = schritt.felder.map(function (f) { return document.getElementById(f[0]); }).find(function (el) { return el.value === ''; });
        if (leer) {
            leer.focus({ preventScroll: true });
        }
    } else if (schritt.art === 'klick') {
        const ziel = document.querySelector(schritt.ziele[0]);
        const geklickt = function () {
            tour.schrittKlicks++;
            setTimeout(function () {
                if (tour && aktuellerSchritt() === schritt && schritt.fertigWenn()) {
                    schrittGeschafft(schritt.ziele[0] === '#Hilfe', schritt.ziele[0].indexOf('#checkButton') === 0); // kein "Super" für die Glühbirne
                }
            }, 80);
        };
        ziel.addEventListener('click', geklickt);
        tour.aufraeumen.push(function () { ziel.removeEventListener('click', geklickt); });
    }
}

// ▶: nur bei Erklärungen und freiwilligen Feldern (sonst ist er ausgeblendet)
function weiterGedrueckt() {
    const schritt = aktuellerSchritt();
    if (!schritt || tour.beschaeftigt || schritt.auto) {
        return;
    }
    if (schritt.art === 'info' || schritt.freiwillig) {
        naechsterSchritt();
    }
}

// Abdunkelung mit Löchern, gelbe Rahmen und Hände an die Stellen des aktuellen Schritts setzen
function setzeSpot() {
    const schritt = aktuellerSchritt();
    if (!schritt) {
        return;
    }
    const breite = window.innerWidth;
    const hoehe = window.innerHeight;
    const rand = 6;
    const markierungen = document.getElementById('tour-markierungen');
    markierungen.innerHTML = '';
    let pfad = 'M0 0H' + breite + 'V' + hoehe + 'H0Z';
    const alle = schritt.ziele.concat(schritt.zeige || []);

    // Würde die Sprechblase etwas verdecken (z.B. die Glühbirne), zuerst die Seite etwas hochschieben.
    // Nur wenn das nicht reicht, kommt die Blase nach oben.
    const blasenEl = document.getElementById('tour-blase');
    blasenEl.classList.remove('oben');
    let blase = blasenEl.getBoundingClientRect();
    const ueberlappung = function () {
        let mehr = 0;
        alle.forEach(function (selektor) {
            const el = document.querySelector(selektor);
            if (!el) {
                return;
            }
            const r = el.getBoundingClientRect();
            if (r.width > 0 && r.bottom + 60 > blase.top && r.top < blase.bottom && r.right > blase.left && r.left < blase.right) {
                mehr = Math.max(mehr, r.bottom + 60 - blase.top);
            }
        });
        return mehr;
    };
    let mehr = ueberlappung();
    if (mehr > 0) {
        window.scrollBy(0, mehr);
        mehr = ueberlappung();
    }
    const verdeckt = mehr > 0;
    if (verdeckt) {
        blasenEl.classList.add('oben');
        blase = blasenEl.getBoundingClientRect();
    }

    alle.forEach(function (selektor, nr) {
        const el = document.querySelector(selektor);
        if (!el || el.offsetParent === null && selektor !== '#mal-svg') {
            return;
        }
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) {
            return;
        }
        const x = r.left - rand;
        const y = r.top - rand;
        const w = r.width + 2 * rand;
        const h = r.height + 2 * rand;
        pfad += ' M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + (-w) + 'Z'; // Loch

        const rahmen = document.createElement('div');
        rahmen.className = 'tour-rahmen';
        rahmen.style.left = x + 'px';
        rahmen.style.top = y + 'px';
        rahmen.style.width = w + 'px';
        rahmen.style.height = h + 'px';
        markierungen.appendChild(rahmen);

        // Hand beim ersten Ziel und bei den Stellen zum Nachschauen
        // (nicht beim Zeigen der Aufgabe am Anfang, sonst meint man, man müsse sie ausfüllen)
        // (die Glühbirne als Zusatz bekommt nur einen Rahmen, sonst sind es zu viele Hände)
        if (!schritt.auto && (nr === 0 || (nr >= schritt.ziele.length && selektor !== '#Hilfe'))) {
            const handGroesse = 56;
            const platzUnten = verdeckt ? hoehe : blase.top;
            const untenFrei = y + h + handGroesse < platzUnten && !(verdeckt && y < blase.bottom + handGroesse);
            const hand = document.createElement('div');
            hand.className = 'tour-hand';
            hand.textContent = untenFrei ? '👆' : '👇';
            hand.style.left = (r.left + r.width / 2 - handGroesse / 2) + 'px';
            hand.style.top = (untenFrei ? y + h + 2 : y - handGroesse - 2) + 'px';
            markierungen.appendChild(hand);
        }
    });

    const maske = document.getElementById('tour-maske');
    maske.setAttribute('width', breite);
    maske.setAttribute('height', hoehe);
    document.getElementById('tour-maske-pfad').setAttribute('d', pfad);
}

let lpTour = null; // { index, klasse (vorher gewählt), aufgabe (gemerkt) }

function starteLpTour() {
    if (tour || lpTour) {
        return;
    }
    // alles merken, was man während der Tour ausprobieren kann
    lpTour = {
        index: 0,
        klasse: klasseMenu.value,
        strich: menuStrich.value,
        menu: menu.value,
        zuZeigen: zuZeigen.checked,
        feldSichtbar: isZwanzigerfeldVisible,
        erw: JSON.parse(JSON.stringify(erw)),
        aufgabe: merkeAufgabe()
    };
    clearTimeout(naechsteAufgabeZeit);
    document.getElementById('lp-tour').style.display = 'block';
    zeigeLpSchritt(true);
}

function beendeLpTour() {
    if (!lpTour) {
        return;
    }
    const gemerkt = lpTour;
    lpTour = null;
    document.getElementById('lp-tour').style.display = 'none';
    klasseMenu.value = gemerkt.klasse;
    menuStrich.value = gemerkt.strich;
    menu.value = gemerkt.menu;
    zuZeigen.checked = gemerkt.zuZeigen;
    Object.keys(gemerkt.erw).forEach(function (k) { Object.assign(erw[k], gemerkt.erw[k]); });
    if (isZwanzigerfeldVisible !== gemerkt.feldSichtbar) {
        toggleZwanzigerfeld();
    }
    onNewKlasseSelected();
    stelleAufgabeWiederHer(gemerkt.aufgabe);
    document.getElementById('lp-tour-start').scrollIntoView({ block: 'center' });
}

function lpTourSchritt(richtung) {
    if (!lpTour) {
        return;
    }
    const ziel = lpTour.index + richtung;
    if (ziel >= LP_TOUR.length) {
        beendeLpTour();
        return;
    }
    if (ziel < 0) {
        return;
    }
    lpTour.index = ziel;
    zeigeLpSchritt(false);
}

function zeigeLpSchritt(erster) {
    const schritt = LP_TOUR[lpTour.index];
    // passende Art einstellen (nur wechseln, wenn nötig: ein Wechsel startet eine neue Aufgabe)
    let klasse = schritt.klasse;
    if (klasse === 'vorher' || klasse === 'erw') {
        klasse = (klasse === 'erw' && lpTour.klasse === '4') ? '1' : lpTour.klasse;
    }
    if (erster || klasseMenu.value !== klasse) {
        klasseMenu.value = klasse;
        onNewKlasseSelected(); // beim ersten Schritt immer: Beispielaufgabe statt der echten
    }
    // Rechenart beim Rechenstrich: für den ZÜ-Schalter kurz "mit ZÜ", sonst die gewählte
    const strich = schritt.strich || lpTour.strich;
    if (klasse === '3' && menuStrich.value !== strich) {
        menuStrich.value = strich;
        onNewTypeSelected();
    }
    // Glühbirne ausprobieren: das Feld muss sichtbar sein
    if (schritt.feldAn && !isZwanzigerfeldVisible) {
        toggleZwanzigerfeld();
    }
    // Erweiterter Zahlenraum: für die Erklärung kurz einschalten (danach kommt die eigene Einstellung zurück)
    if (schritt.erwAn && erw[klasse] && !erw[klasse].an) {
        setzeErweitert(true);
    }
    // Zum Ausprobieren: Klicks in den markierten Stellen erlauben
    document.getElementById('lp-tour-sperre').style.display = schritt.aktiv ? 'none' : 'block';
    document.getElementById('lp-tour-titel').textContent = schritt.titel;
    document.getElementById('lp-tour-text').innerHTML = schritt.text;
    document.getElementById('lp-tour-zaehler').textContent = (lpTour.index + 1) + ' / ' + LP_TOUR.length;
    document.getElementById('lp-tour-zurueck').disabled = lpTour.index === 0;
    document.getElementById('lp-tour-weiter').textContent = lpTour.index === LP_TOUR.length - 1 ? 'Fertig' : 'Weiter';
    const ziele = lpZiele();
    if (ziele.length) {
        ziele[0].scrollIntoView({ block: 'center' });
    } else {
        window.scrollTo(0, 0);
    }
    setzeLpSpot();
    document.getElementById('lp-tour-weiter').focus({ preventScroll: true });
}

// Die Elemente des aktuellen Schritts, die gerade sichtbar sind
function lpZiele() {
    const schritt = lpTour && LP_TOUR[lpTour.index];
    if (!schritt || !schritt.ziel) {
        return [];
    }
    return [].concat(schritt.ziel).map(function (s) { return document.querySelector(s); }).filter(function (el) {
        if (!el || el.offsetParent === null) {
            return false;
        }
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
    });
}

// Abdunkeln mit Löchern um die erklärten Stellen; Karte so setzen, dass sie möglichst wenig verdeckt
function setzeLpSpot() {
    if (!lpTour) {
        return;
    }
    const breite = window.innerWidth;
    const hoehe = window.innerHeight;
    const karte = document.getElementById('lp-tour-karte');
    const rahmen = document.getElementById('lp-tour-rahmen');
    const maske = document.getElementById('lp-tour-maske');
    maske.setAttribute('width', breite);
    maske.setAttribute('height', hoehe);
    let pfad = 'M0 0H' + breite + 'V' + hoehe + 'H0Z';
    rahmen.innerHTML = '';
    const rand = 6;
    const flaechen = lpZiele().map(function (el) {
        const r = el.getBoundingClientRect();
        return { x: r.left - rand, y: r.top - rand, w: r.width + 2 * rand, h: r.height + 2 * rand };
    });
    flaechen.forEach(function (f) {
        pfad += ' M' + f.x + ' ' + f.y + 'h' + f.w + 'v' + f.h + 'h' + (-f.w) + 'Z';
        const r = document.createElement('div');
        r.className = 'lp-rahmen';
        r.style.left = f.x + 'px';
        r.style.top = f.y + 'px';
        r.style.width = f.w + 'px';
        r.style.height = f.h + 'px';
        rahmen.appendChild(r);
    });
    karte.classList.remove('oben', 'mitte');
    if (flaechen.length) {
        // Karte unten oder oben, je nachdem wo sie weniger von den markierten Stellen verdeckt
        const verdeckt = function () {
            const k = karte.getBoundingClientRect();
            return flaechen.reduce(function (summe, f) {
                const b = Math.max(0, Math.min(k.right, f.x + f.w) - Math.max(k.left, f.x));
                const h = Math.max(0, Math.min(k.bottom, f.y + f.h) - Math.max(k.top, f.y));
                return summe + b * h;
            }, 0);
        };
        const unten = verdeckt();
        if (unten > 0) {
            karte.classList.add('oben');
            if (verdeckt() >= unten) {
                karte.classList.remove('oben');
            }
        }
    } else {
        karte.classList.add('mitte');
    }
    document.getElementById('lp-tour-maske-pfad').setAttribute('d', pfad);
}

['click', 'change'].forEach(function (art) {

document.addEventListener('keydown', function (e) {
    if (!lpTour) {
        return;
    }
    // In Menüs und Feldern brauchen die Pfeiltasten ihre normale Funktion
    const inFeld = e.target && /^(SELECT|INPUT)$/.test(e.target.tagName);
    if (e.key === 'Escape') {
        beendeLpTour();
    } else if (e.key === 'ArrowRight' && !inFeld) {
        lpTourSchritt(1);
    } else if (e.key === 'ArrowLeft' && !inFeld) {
        lpTourSchritt(-1);
    }
});

function toggleProgressBar() {
    const progressContainer = document.getElementById("progress-container");
    const percentage = document.getElementById("progress-percentage")
    const toggleButton = document.getElementById("toggle-progress-bar");
    const code = document.getElementById("Code");

    

    if ( !progress_bar_is_visible && code.value === "Code") {
        progressContainer.style.display = "flex";
        percentage.style.display = "flex"
        toggleButton.textContent = "Lehrpersonenbereich schliessen";
        progress_bar_is_visible = true;
    } else if (progress_bar_is_visible) {
        progressContainer.style.display = "none";
        toggleButton.textContent = "Lehrpersonenbereich";
        code.value = ""
        code.style.display = "none"
        percentage.style.display = "none"

        progress_bar_is_visible = false
        code_field_is_visible = false;
    }
    else if ( !code_field_is_visible) {
        code.style.display = "block"
        toggleButton.textContent = "Lehrpersonenbereich öffnen";
        code_field_is_visible = true
    }
}

// Abwechselnd ein lustiges und ein schönes Bild; jede Liste wird gemischt und erst wiederholt, wenn alle Bilder einmal dran waren
let tierRunde = 0;
const tierStapel = { lustig: [], schoen: [] };
function naechstesTierbild() {
    const art = (tierRunde++ % 2 === 0) ? 'lustig' : 'schoen';
    if (tierStapel[art].length === 0) {
        const neu = TIERBILDER[art].slice();
        for (let i = neu.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [neu[i], neu[j]] = [neu[j], neu[i]]; }
        tierStapel[art] = neu;
    }
    return tierStapel[art].pop();
}

// Lädt schon im Hintergrund das nächste Tierbild, damit es bei der Belohnung sofort da ist
let nextAnimalFoto = '';
function preloadNextAnimalImage() {
    const bild = naechstesTierbild();
    nextAnimalImage = new Image();
    nextAnimalImage.src = bild[0];
    nextAnimalFoto = bild[1];
}

function showRandomAnimalImage() {
    const animalContainer = document.getElementById("animal-container");
    const animalImage = document.getElementById("animal-image");

    // Das vorgeladene Bild anzeigen und gleich das nächste vorladen
    animalImage.src = nextAnimalImage.src;
    document.getElementById("animal-foto").textContent = nextAnimalFoto;
    preloadNextAnimalImage();

    // Zeige das Bild
    animalContainer.style.display = "flex";

    // Blende das Bild nach 3 Sekunden aus
    setTimeout(() => {
        animalContainer.style.display = "none";
    }, 3000); // 3000 Millisekunden = 3 Sekunden
}

// Start: erste Aufgabe sofort anzeigen (nicht erst warten, bis alle Bilder geladen sind)

onNewKlasseSelected();
preloadNextAnimalImage();
